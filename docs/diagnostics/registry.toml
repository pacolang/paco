[E0813]
message_template = "`grad` needs a floating-point scalar result"
severity = "error"
explanation = """
`grad` computes the derivative of one scalar with respect to its inputs. The result is the function's return value, or, for a function that returns `()`, the final value of its single differentiable `&mut` parameter."""
cause = "The differentiated function returns a non-scalar value, or returns `()` with zero or several differentiable `&mut` parameters."
fix = "Return a scalar loss computed from the value (for example the sum of its components), or give the `()`-returning function exactly one differentiable `&mut` parameter."
spec_ref = "docs/design/spec.md"
adr_ref = "docs/design/decisions/0026-native-autodiff.md"
introduced_in = "native-autodiff"
status = "active"

[E0902]
message_template = "`use std::{module}` has moved to `{library}`; add `use {library};` and run `paco get {library}`"
severity = "error"
explanation = """
`std::numerics`, `std::math` and `std::blas` moved out of the compiler into their own libraries, one repository \
per module: `github.com/pacolang/tensor` (renamed from `numerics`), `github.com/pacolang/math` and \

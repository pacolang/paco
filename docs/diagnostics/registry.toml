[E0814]
message_template = "invalid `#[derivative(of = {function})]`"
severity = "error"
explanation = """
`#[derivative(of = f)] fn d(<f's parameters>) -> (<f's result>, P)` registers `d` as the derivative of `f`, where `P` satisfies `std::autodiff::Pullback` with `Seed` the tangent of `f`'s result and `Gradients` the tangents of `f`'s differentiable parameters (a tuple when there are several). A function has at most one."""
cause = "The attribute names an unknown function, the parameters or the result differ from `f`'s, `P` lacks `Seed`, `Gradients` or `pullback`, their types do not match, or `f` already has a derivative."
fix = "Make `d`'s parameters identical to `f`'s and its result `(<f's result>, P)`, give `P` the matching `Seed`, `Gradients` and `pullback`, and keep one derivative per function."
spec_ref = "docs/design/spec.md"
adr_ref = "docs/design/decisions/0026-native-autodiff.md"
introduced_in = "native-autodiff"
status = "active"
lint = false

[E0815]
message_template = "the fields of a value whose `Tangent` is not itself are read without a `#[derivative]`"
severity = "error"
explanation = """
When a type's `Tangent` is itself, the gradient of each field is routed to the same field. When it is another type, the compiler cannot map fields to tangent fields, so a function reading the fields of such a value on a differentiated path needs a hand-written derivative."""
cause = "A differentiated function reads a field of, or returns, a value whose `type Tangent` differs from its own type, and has no `#[derivative]`."
fix = "Give the function that reads the fields a `#[derivative(of = ...)]` returning the gradient as the `Tangent` type, or make the type its own `Tangent`."
spec_ref = "docs/design/spec.md"
adr_ref = "docs/design/decisions/0026-native-autodiff.md"
introduced_in = "native-autodiff"
status = "active"
lint = false

[E0901]
message_template = "`use std::{module}` is deprecated; replace it with `use {library};` (the `{new_module}::` qualifier)"

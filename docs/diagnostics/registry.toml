[E0812]
message_template = "a value that carries a derivative is passed to a call whose target is not known at compile time"
severity = "error"
explanation = """
A call through a function value (a closure or `fn` value) is resolved at run time, so the compiler cannot know which body to differentiate."""
cause = "A differentiated value is an argument or the result of an indirect call, or a gradient contains a gradient of the function that takes it."
fix = "Call the function by name."

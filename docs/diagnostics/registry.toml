# Every diagnostic code Paco emits. See README.md in this directory.
#
# A code never changes meaning once released. Retire it and point at a successor
# instead. Codes are never recycled.

[E0335]
message_template = "cannot infer the type of this closure parameter; add a type annotation"
severity = "error"
explanation = """
A closure parameter written without a type annotation (`|x| x + 1`) takes \
its type from the arguments of the first call to the closure. A closure \
that is never called with arguments of a known type gives the compiler \
nothing to infer the parameter's type from."""
cause = "An unannotated closure parameter has no call site from which its type can be inferred."
fix = "Annotate the parameter (`|x: i64| x + 1`), or call the closure with arguments of a known type."
spec_ref = "docs/grammar/grammar.ebnf"
adr_ref = "docs/design/decisions/0018-blocking-foreign-calls.md"
introduced_in = "phase-8"
status = "active"
lint = false

[E0354]
message_template = "cannot derive `Copy`: field `{field}` has type `{type}`, which is not `Copy`"
severity = "error"
explanation = """
`#[derive(Copy)]` makes a struct or enum duplicate bit for bit on assignment, \
argument passing and reads instead of moving. That is only sound when \
nothing in the value owns a resource, so every field and variant payload \
must itself be `Copy`: numeric primitives, `bool`, `char`, shared borrows, \
raw pointers, tuples of `Copy` types and other `Copy` user types."""
cause = "A type marked `#[derive(Copy)]` has a field or payload whose type owns a resource or moves."
fix = "Remove `Copy` from the derive, or change the field to a `Copy` type."
spec_ref = "docs/design/spec.md"
introduced_in = "real-programs-gaps"
status = "active"
lint = false

[E0353]
message_template = "cannot derive `{trait_name}`: no `#[derivable(..)]` registration found"
severity = "error"
explanation = """
`#[derive(Trait, ...)]` (`phase-9-comptime` Decision 8) expands each named \
trait by looking up a `#[derivable(fn_name)]` attribute on that trait's \
own declaration — the `comptime fn` that generates a satisfying \
implementation. A trait with no such attribute has no registered \
derive expansion, so it cannot be named in `#[derive(..)]`."""
cause = "`#[derive(..)]` named a trait whose declaration has no `#[derivable(..)]` attribute."
fix = "Add `#[derivable(fn_name)]` to the trait's own declaration, naming a `comptime fn` that generates a satisfying implementation — or remove the trait from `#[derive(..)]` and implement it by hand."
spec_ref = "openspec/changes/phase-9-comptime/design.md"
adr_ref = "docs/design/decisions/0005-metaprogramming-and-packages.md"
introduced_in = "phase-9"
status = "active"
lint = false

[E0352]
message_template = "{what} is a `comptime fn` and can only be called from inside a comptime context"
severity = "error"
explanation = """
A `comptime fn` may use `Value::Type`/`Code` (`phase-9-comptime` Decision \
5/7), neither of which has any representation once compilation finishes \
— so calling one only makes sense while already inside a comptime \
context: a `comptime { .. }` block, another `comptime fn`'s own body, or \
the `#[derive]` expansion machinery."""
cause = "A `comptime fn` was called from ordinary (non-comptime) code."
fix = "Call it from inside `comptime { .. }`, or from another `comptime fn`."
spec_ref = "openspec/changes/phase-9-comptime/design.md"
adr_ref = "docs/design/decisions/0005-metaprogramming-and-packages.md"
introduced_in = "phase-9"
status = "active"
lint = false

[E0351]
message_template = "`{name}` is generic; a `type` argument must name a non-generic struct or enum"
severity = "error"
explanation = """
A bare struct/enum name passed where a `type`-typed parameter is expected \
resolves to a captured `Type::TypeValue`, per `phase-9-comptime`'s \
type-as-value mechanism — but only for a non-generic struct or enum. \
Passing a generic type's own name (e.g. `Box` from `struct Box<T> { .. \
}`) has no single concrete type to capture without further type \
arguments, which this mechanism does not resolve."""
cause = "A generic struct or enum's bare name was passed as a `type` argument."
fix = "Pass a non-generic struct or enum name instead. Passing an already-instantiated generic type (e.g. `Box<i64>`) as a `type` value is not supported."
spec_ref = "openspec/changes/phase-9-comptime/design.md"
adr_ref = "docs/design/decisions/0005-metaprogramming-and-packages.md"
introduced_in = "phase-9"
status = "active"
lint = false

[E0350]
message_template = "comptime evaluation failed: {reason}"
severity = "error"
explanation = """
A `comptime { .. }` block failed while the compiler ran it at compile time \
— distinct from an ordinary type error, since the block type-checked \
successfully and the failure only happens during evaluation: performing \
file/network I/O, calling an `extern` function, exceeding the instruction \
budget, or another comptime-only restriction."""
cause = "The block's code, once type-checked, attempted something comptime execution forbids (I/O, FFI, or unbounded work), or otherwise failed while the compiler evaluated it."
fix = "Remove the forbidden operation from the `comptime` block, or restructure the computation to terminate within the evaluator's instruction budget."
spec_ref = "docs/design/decisions/0005-metaprogramming-and-packages.md"
adr_ref = "docs/design/decisions/0005-metaprogramming-and-packages.md"
introduced_in = "phase-9"
status = "active"
lint = false

[E0301]
message_template = "type mismatch: expected {expected}, found {found}"
severity = "error"
explanation = """
An operator or assignment received operands whose types do not agree. Paco has \
no implicit conversion between numeric types, and none at all between a numeric \
type and `string`."""
cause = "One operand's type is not compatible with the other's, and no implicit conversion exists to bridge them."
fix = "Convert explicitly with `as`, or change one side so the types agree. Even widening needs an explicit `as`."
spec_ref = "docs/design/spec.md#9-ergonomics--performance-feature-10"
adr_ref = "docs/design/decisions/0014-reduced-precision-floats.md"
introduced_in = "phase-2"
status = "active"
lint = false

[L0001]
message_template = "use of `{name}` after it was moved"
severity = "error"
explanation = """
A moved value loses its original owner. Reading the old binding afterwards is \
always an ownership bug, because the value it named no longer lives there."""
cause = "The value was passed by value, assigned to another binding, or sent over a channel, and the original binding was used after that point."
fix = "Borrow instead of moving (`&` or `&mut`) if ownership does not need to transfer, or clone before the move if both are genuinely needed."
spec_ref = "docs/design/spec.md#3-ownership-borrowing-and-lifetimes"
adr_ref = "docs/design/decisions/0001-memory-model.md"
introduced_in = "phase-4"
status = "active"
lint = "use-after-move"

[L0002]
message_template = "`{name}` is a bare reference; wrap it in `Arc` to share it with a spawned task"
severity = "error"
explanation = """
A `&T` borrow is only valid for the lifetime of its owner's stack frame. A \
spawned task may run concurrently with, or outlive, the frame that took the \
borrow, so the borrow checker cannot prove it stays valid on the other side. \
`Arc<T>` is an owned, reference-counted value — not a borrow — so it crosses \
the boundary safely."""
cause = "A bare `&T` (not wrapped in `Arc<T>`) was captured by a `spawn` expression or sent as the value argument to `Sender::send`."
fix = "Wrap the value in `Arc::new(...)` before capturing it in `spawn` or sending it over a channel."
spec_ref = "docs/design/spec.md#8-concurrency-tasks-generators-and-channels-features-3-11-12"
adr_ref = "docs/design/decisions/0001-memory-model.md"
introduced_in = "phase-8"
status = "active"
lint = "shared-without-sync"

[E0115]
message_template = "expected `;` after this statement"
severity = "error"
explanation = """
Every statement ends in `;`, as in Rust; a newline does not end one. Only \
the final expression of a block, whose value is the block's value, and an \
expression statement ending in a block (`if`, `match`, `while`, `for`, \
`loop`, `select`, `unsafe`, `comptime`, `{ }`) may omit it. Items that are \
not blocks — `module`, `use`, `const`, an associated `type` — also end in \
`;`."""
cause = "A statement or non-block item was followed by more code without a `;` between them."
fix = "Insert `;` at the end of the statement the diagnostic points at."
spec_ref = "docs/grammar/grammar.ebnf"
introduced_in = "phase-13"
status = "active"
lint = false

[E0114]
message_template = "a const parameter pack must be the last generic parameter"
severity = "error"
explanation = """
A trailing const parameter pack (`const D: int...`) takes every remaining \
generic argument, so nothing may follow it, and a parameter list has at most \
one."""
cause = "A const parameter pack was followed by another generic parameter, or a second pack was declared."
fix = "Move the pack to the end of the parameter list, and keep only one."
spec_ref = "docs/grammar/grammar.ebnf"
adr_ref = "docs/design/decisions/0023-const-generics.md"
introduced_in = "phase-13"
status = "active"
lint = false

[E0336]
message_template = "shape mismatch: dimension {index} expected `{expected}`, found `{found}`"
severity = "error"
explanation = """
Two types provably differ in a dimension. Dimension expressions are compared \
by their polynomial normal forms, so `B + B` equals `2 * B` and `(N + 1) * 2` \
equals `2 * N + 2`; two dimensions provably differ when their difference is a \
non-zero constant (`2 * n` and `2 * n + 1`), when two literals differ, when the \
ranks differ, or when a static extent meets a run-time one (`Dyn` or a name): \
those are stored differently and are never equal. A difference that is not a \
constant is `PACO-E0342` ("cannot prove") instead."""
cause = "A value whose shape (or rank) provably disagrees with the expected type was passed, returned or assigned."
fix = "Make the shapes agree; for a dimension known only at run time, declare it `Dyn` or name it with a `dim` parameter or a witness."
spec_ref = "docs/design/spec.md"
adr_ref = "docs/design/decisions/0029-named-dynamic-dimensions.md"
introduced_in = "phase-13"
status = "active"
lint = false

[E0337]
message_template = "`{item}` exceeds its instantiation limit of {limit} distinct const arguments; instantiated with {constants}"
severity = "error"
explanation = """
Every distinct set of const arguments is a separate monomorphised copy of an \
item. The number per item is capped so a shape-parameterised library cannot \
make compilation unbounded; the diagnostic lists every set of constants seen."""
cause = "A generic item was used with more distinct const arguments than its limit (256 by default)."
fix = "Raise the limit with `#[instantiation_limit(N)]` on the item, or declare a dimension that varies `dim` (one instance for every extent) or `Dyn`."
spec_ref = "docs/design/spec.md"
adr_ref = "docs/design/decisions/0023-const-generics.md"
introduced_in = "phase-13"
status = "active"
lint = false

[E0338]
message_template = "expected a constant dimension or `Dyn`, found {found}"
severity = "error"
explanation = """
A const generic parameter takes an integer constant expression over literals \
and const parameters, or `Dyn`; a type parameter takes a type. The argument \
given does not fit its parameter's kind."""
cause = "A type was written where a dimension is expected, or a constant where a type is expected."
fix = "Pass a dimension (`768`, `N * 2`, `Dyn`, `D...`) to a const parameter and a type to a type parameter."
spec_ref = "docs/grammar/grammar.ebnf"
adr_ref = "docs/design/decisions/0023-const-generics.md"
introduced_in = "phase-13"
status = "active"
lint = false

[E0339]
message_template = "`{type}` is a storage-only format with no arithmetic or ordering; convert with `as` first"
severity = "error"
explanation = """
`f8e4m3` and `f8e5m2` carry no arithmetic operators and no comparison beyond \
equality: they are storage and interchange formats, computed on after an \
explicit widening."""
cause = "An arithmetic or ordering operator was applied to FP8 values."
fix = "Widen explicitly (`(w as f32) * x`) and narrow the result back if needed."
spec_ref = "docs/design/spec.md"
adr_ref = "docs/design/decisions/0014-reduced-precision-floats.md"
introduced_in = "phase-13"
status = "active"
lint = false

[E0340]
message_template = "`{type}` does not satisfy `{trait}`, required by `{param}` in `{item}`"
severity = "error"
explanation = """
A type parameter's trait bound is checked where the item is used. Primitives \
satisfy the operator traits natively (FP8 has none); other types satisfy a \
trait by having all of its methods."""
cause = "A generic item was used with a type argument that lacks a bound its parameter requires."
fix = "Use a type that satisfies the bound, or convert the value first."
spec_ref = "docs/design/spec.md"
introduced_in = "phase-13"
status = "active"
lint = false

[E0341]
message_template = "`#[differentiable]` function `{name}`: only floating-point scalars and `Differentiable` types can be differentiated"
severity = "error"
explanation = """
The compiler differentiates floating-point data. A `#[differentiable]` \
function takes and returns float scalars (`f64`, `f32`, `f16`, `bf16`), values \
of types that satisfy `std::autodiff::Differentiable` (a `type Tangent`, \
`zero_tangent` and `move_by`), borrows of them, or tuples of them, and `grad` \
only accepts such a function. FP8 values never carry a derivative."""
cause = "A `#[differentiable]` signature mentions a type that is neither a float with arithmetic nor `Differentiable`, or `grad` was given a function that is not `#[differentiable]`."
fix = "Differentiate with respect to floating-point or `Differentiable` inputs only (add `type Tangent`, `zero_tangent` and `move_by` to a type of your own), and mark the function `#[differentiable]`."
spec_ref = "docs/design/spec.md"
adr_ref = "docs/design/decisions/0026-native-autodiff.md"
introduced_in = "phase-13"
status = "active"
lint = false

[E0342]
message_template = "cannot prove these dimensions are equal: dimension {index} expected `{expected}`, found `{found}`"
severity = "error"
explanation = """
Where two dimensions must be equal, the type checker proves it by comparing \
polynomial normal forms. Two different run-time names (witnesses such as \
`let n = x.dim(0);`, the anonymous `x.dim0` of an immutable binding, `dim` \
parameters, opened existentials), two `Dyn` extents, a parameter bound to \
`Dyn` by one argument and used again by another, and expressions whose \
difference is not a constant (`/`, `%` and overflowing terms are opaque) \
cannot be proved equal. The diagnostic names where each name was bound. The \
compiler never turns such an equality into a run-time check."""
cause = "Two dimensions that must agree are different names, anonymous `Dyn` extents or expressions that differ by more than a constant."
fix = "Refine the values once with `with_dims` so both carry the same name, use the type's `checked_*` form, which compares at run time and returns `Result`, or write the dimensions so that they are equal as polynomials."
spec_ref = "docs/design/spec.md"
adr_ref = "docs/design/decisions/0029-named-dynamic-dimensions.md"
introduced_in = "named-dynamic-dims"
status = "active"
lint = false

[E0344]
message_template = "cannot infer `{param}` from `{expected}`"
severity = "error"
explanation = """
A dimension parameter is inferred only where it appears alone in a parameter's \
dimension, or from `N + c` with a literal `c`. Any other position, such as \
`2 * N`, does not determine the parameter, and the call must pass it."""
cause = "A call relies on inferring a dimension parameter that appears only in a non-invertible expression."
fix = "Pass the parameter explicitly, for example `half<4>(g)`."
spec_ref = "docs/design/spec.md"
adr_ref = "docs/design/decisions/0029-named-dynamic-dimensions.md"
introduced_in = "named-dynamic-dims"
status = "active"
lint = false

[E0343]
message_template = "the dimension `{name}` would become `Dyn` implicitly"
severity = "error"
explanation = """
A named dimension (a witness such as `let n = x.dim(0);`, a `dim` parameter or \
an opened existential) is only valid in the scope that bound it, and it is \
never weakened to `Dyn` behind the program's back. Returning or storing a value \
whose type names it where the type says `Dyn`, or assigning it to a variable \
that outlives the scope (a loop iteration opens a fresh name each time), would \
drop the name silently. Passing it to a parameter declared `Dyn` is the one \
implicit conversion."""
cause = "A value whose type names a dimension is returned, annotated or assigned where `Dyn` is written, or outlives the scope of the name."
fix = "Name the extent in the signature (`-> Grid<f32, ?n>`), or forget the name explicitly with `.erase_dims()`."
spec_ref = "docs/design/spec.md"
adr_ref = "docs/design/decisions/0029-named-dynamic-dimensions.md"
introduced_in = "named-dynamic-dims"
status = "active"
lint = false

[E0345]
message_template = "`{name}` cannot name a dimension: {reason}"
severity = "error"
explanation = """
`v.dim(i)` reads the extent of axis `i` of a `Shaped` value and, bound by an \
immutable `let`, names it for the rest of the block. The axis must be an \
integer literal within the value's rank, the receiver's type must satisfy \
`std::dims::Shaped` (`fn extent(&self, axis: i64) -> i64`), and a `let mut` \
binding cannot name a dimension because its value could change."""
cause = "`dim` was called with a computed or out-of-range axis or on a type that is not `Shaped`, or a `let mut` binding was used in a type."
fix = "Use an integer literal axis within the rank, give the type an `extent` method, or bind the witness with `let`."
spec_ref = "docs/design/spec.md"
adr_ref = "docs/design/decisions/0029-named-dynamic-dimensions.md"
introduced_in = "named-dynamic-dims"
status = "active"
lint = false

[E0346]
message_template = "cannot prove this broadcast: {problem}"
severity = "error"
explanation = """
A method marked `#[broadcasts(D, T)]` broadcasts its source pack `D` to its \
target pack `T`. Aligned from the right, each source dimension must be proved \
equal to its target or be the literal `1`; missing leading dimensions are \
added. A run-time extent is never treated as `1`, since it might not be."""
cause = "A dimension of the source is neither provably equal to its target nor the literal `1`."
fix = "Use the type's `checked_broadcast_to()`, which compares at run time and returns `Result`, or refine the source with `with_dims` first."
spec_ref = "docs/design/spec.md"
adr_ref = "docs/design/decisions/0029-named-dynamic-dimensions.md"
introduced_in = "named-dynamic-dims"
status = "active"
lint = false

[E0347]
message_template = "`const {param}` cannot take the run-time dimension `{dimension}`"
severity = "error"
explanation = """
A `const` parameter is static: each value is a separate instantiation, known \
when the program is compiled. A dimension known only at run time (a witness, \
a `dim` parameter or an existential) cannot instantiate it. A `dim` parameter \
accepts static, named and `Dyn` extents alike and is passed at run time."""
cause = "A named, run-time dimension was passed where a `const` parameter is declared."
fix = "Declare the parameter `dim N` instead of `const N: int`."
spec_ref = "docs/design/spec.md"
adr_ref = "docs/design/decisions/0029-named-dynamic-dimensions.md"
introduced_in = "named-dynamic-dims"
status = "active"
lint = false

[E0348]
message_template = "`{method}` cannot turn `{from}` into `{to}`"
severity = "error"
explanation = """
`with_dims`, `as_dims` and `assume_dims` rename the dimensions of a value \
without copying it, so the target must have the same type constructor, element \
type and rank, and each position must stay static or stay dynamic: a static \
and a run-time extent are stored differently. The target comes from the \
context (a `let` annotation, a parameter or the return type), and a static \
position that differs from the source is `PACO-E0336`."""
cause = "A refinement changes a static position to a dynamic one (or back), changes the type or rank, or has no annotated target."
fix = "Annotate the binding with the target type, keep static positions static, or use a copying conversion of the type."
spec_ref = "docs/design/spec.md"
adr_ref = "docs/design/decisions/0029-named-dynamic-dimensions.md"
introduced_in = "named-dynamic-dims"
status = "active"
lint = false

[E0801]
message_template = "`std::autodiff::grad` cannot be built: no backend of this toolchain differentiates it"
severity = "error"
explanation = """
Retired: gradients are computed by the compiler itself, over MIR, in every \
build mode (ADR 0026), so a gradient request is never refused for lack of a \
backend. There is no successor."""
cause = "Earlier toolchains rejected every program that called `std::autodiff::grad`."
fix = "Nothing to fix: `grad` builds and runs in `paco run`, `paco build` and `paco build --release`."
spec_ref = "docs/design/spec.md"
adr_ref = "docs/design/decisions/0026-native-autodiff.md"
introduced_in = "phase-13"
status = "retired"
lint = false

[E0802]
message_template = "the target glibc (`{file}`) for `{target}` was not found; searched {dirs}; pass the target system's root with `--sysroot <dir>`"
severity = "error"
explanation = """
A dynamically linked program (one with `extern` blocks, or built with \
`--link dynamic`) links against the target system's own glibc: `libc.so.6`, \
`libm.so.6` and `libgcc_s.so.1`. For a build for the host's architecture they \
come from `/`; for another architecture they come from the system root given \
with `--sysroot` or `PACO_SYSROOT`."""
cause = "A dynamic build could not find one of the target's C runtime libraries in any searched directory."
fix = "Pass `--sysroot <dir>` pointing at a copy of the target system's root (for example a Debian `libc6` and `libgcc-s1` package extracted with `scripts/fetch-sysroot.sh`), or build a program without `extern` blocks statically."
spec_ref = "docs/design/spec.md"
introduced_in = "self-contained-toolchain"
status = "active"
lint = false

[E0803]
message_template = "library `lib{name}` for the `extern` block in module `{name}` was not found for target `{target}`; searched {dirs}; pass the target system's root with `--sysroot <dir>`"
severity = "error"
explanation = """
Each module containing an `extern` block is linked against the shared library \
of the same name (`blas` → `libblas.so`, or a versioned `libblas.so.N`), found \
in the target system's library directories."""
cause = "No `lib<name>.so`, `lib<name>.a` or `lib<name>.so.N` exists in the searched directories."
fix = "Install the library for the target, or pass `--sysroot <dir>` pointing at a system root that has it."
spec_ref = "docs/design/spec.md"
introduced_in = "self-contained-toolchain"
status = "active"
lint = false

[E0804]
message_template = "`extern` blocks need dynamic linking against the target's C libraries, but `{target}` is a static build; use `--link dynamic` or a `-gnu` target"
severity = "error"
explanation = """
Static builds link Paco's runtime with musl and contain no dynamic loader, so \
they cannot load the shared C libraries an `extern` block calls. Programs \
with `extern` blocks link dynamically against glibc by default; this error \
appears only when static linking was requested explicitly."""
cause = "`--link static` or a `-musl` target was given for a program with an `extern` block."
fix = "Drop `--link static` / the `-musl` suffix, or remove the `extern` block."
spec_ref = "docs/design/spec.md"
introduced_in = "self-contained-toolchain"
status = "active"
lint = false

[E0805]
message_template = "component `{file}` for target `{target}` is missing from the Paco distribution at `{path}`"
severity = "error"
explanation = """
`paco build` links with files shipped in the distribution's `lib/paco/<target>/` \
directory: musl's startup objects and `libc.a`, `libunwind.a` and the Paco \
runtime archive. A development checkout takes them from the rustup toolchain \
and `runtime/target/`."""
cause = "The distribution is incomplete, or (in a development checkout) the runtime was not built for that target."
fix = "Reinstall the Paco distribution; in a development checkout run `scripts/dist.sh`, which builds the runtime for every supported target."
spec_ref = "docs/design/spec.md"
introduced_in = "self-contained-toolchain"
status = "active"
lint = false

[E0810]
message_template = "a value that carries a derivative is passed to or returned from `{function}`, which the compiler cannot differentiate"
severity = "error"
explanation = """
A gradient reaches a call whose body the compiler cannot see: an `extern` function, or a runtime primitive with no derivative rule. Its effect on the result cannot be differentiated."""
cause = "A value that depends on a differentiated input, and that the result depends on, is an argument or the result of such a call."
fix = "Give the function a hand-written derivative with `#[derivative(of = f)]` (for an `extern` function, write a Paco wrapper and give the wrapper the derivative), or keep the value out of the call."
spec_ref = "docs/design/spec.md"
adr_ref = "docs/design/decisions/0026-native-autodiff.md"
introduced_in = "native-autodiff"
status = "active"
lint = false

[E0811]
message_template = "a value that carries a derivative is read or written through a raw pointer, sent to another task, or reinterpreted"
severity = "error"
explanation = """
Differentiation follows every place a value is stored in. A raw-pointer read or write, a borrow whose target is not known at compile time, a value moved to another task or channel, or a bit-level reinterpretation hides where the derivative goes."""
cause = "A value that depends on a differentiated input reaches one of those constructs on the way to the result."
fix = "Borrow the value directly instead of through a pointer or a borrow returned by a call, keep tasks and channels outside the differentiated code, or give the function containing the construct a `#[derivative]`."
spec_ref = "docs/design/spec.md"
adr_ref = "docs/design/decisions/0026-native-autodiff.md"
introduced_in = "native-autodiff"
status = "active"
